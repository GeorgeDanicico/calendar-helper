spring:
  application:
    name: calendar-helper
  datasource:
    url: jdbc:h2:mem:calendar_helper;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/calendar.readonly
              - https://www.googleapis.com/auth/calendar.events
              - https://www.googleapis.com/auth/gmail.readonly
  config:
    import: optional:file:.env[.properties]
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

app:
  calendar:
    id: primary
    time-zone: Europe/Bucharest
    default-duration-minutes: 60
  openai:
    chat:
      system-prompt: >
        You are an assistant that reviews email messages and determines whether they
        describe an appointment. Extract appointment, time, appointmentType, and
        location. Use ISO-8601 local date-time for time, return null for missing
        values, and use 00:00:00 when only a date is available.
      sample-email-message: >
        Hello, this is a reminder for your dentist appointment on 2026-05-13 at 14:30
        at Bright Dental Clinic, 12 Main Street.
