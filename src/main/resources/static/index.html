<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Calendar Helper</title>
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<main class="page-shell">
		<section class="auth-panel" aria-labelledby="page-title">
			<p class="eyebrow">Calendar Helper</p>
			<h1 id="page-title">Connect your Google account</h1>
			<p class="lede">
				Authorize access so Calendar Helper can read appointment emails and create calendar events.
			</p>
			<a class="google-button" href="/oauth2/authorization/google">
				<span class="google-mark" aria-hidden="true">G</span>
				<span>Continue with Google</span>
			</a>
		</section>
	</main>
</body>
</html>
