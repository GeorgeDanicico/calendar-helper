quarkus:
  application:
    name: calendar-helper
  otel:
    service:
      name: calendar-helper
    exporter:
      otlp:
        endpoint: http://localhost:4317
  http:
    record-request-start-time: true
    access-log:
      enabled: true
      log-to-file: false
      pattern: '%{time,yyyy-MM-dd HH:mm:ss,SSS} host=%h tid=%{X,traceId} %r %s size=%b time=%D'
  datasource:
    db-kind: h2
    username: sa
    password:
    jdbc:
      telemetry: true
      url: jdbc:h2:mem:calendar_helper;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  flyway:
    migrate-at-start: true
    locations: db/migration
  langchain4j:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat-model:
        model-name: gpt-4.1-mini
        temperature: 0
  log:
    handler:
      file:
        access-log:
          enabled: true
          path: 'target/calendar-helper-access.log'
          format: '%m%n'
          rotation:
            file-suffix: '.yyyy-MM-dd-HH'
    level: INFO
    category:
      "io.quarkus.http.access-log":
        handlers:
          - access-log
        use-parent-handlers: false
    file:
      enabled: true
      path: 'target/calendar-helper-server.log'
      format: '%d{yyyy-MM-dd HH:mm:ss,SSS} tid=%X{traceId} host=%h %N[%i] %-5p [%c{3.}] (%t) %s%e%n'
      rotation:
        enabled: true
        file-suffix: '.yyyy-MM-dd-HH'

app:
  appointment:
    email-scan-cron: "*/50 * * * * ?"
    mock-gmail-messages:
      enabled: false
  calendar:
    id: primary
    time-zone: Europe/Bucharest
    default-duration-minutes: 60
  google:
    oauth:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
      scopes: openid,profile,email,https://www.googleapis.com/auth/calendar.readonly,https://www.googleapis.com/auth/calendar.events,https://www.googleapis.com/auth/gmail.readonly
