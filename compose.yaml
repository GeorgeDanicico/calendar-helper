services:
  jaeger:
    image: 'jaegertracing/jaeger:latest'
    ports:
      - '16686:16686'
      - '4317:4317'
      - '4318:4318'

  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
